<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Cuantificadores Matemáticos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .game-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .question {
            font-size: 18px;
            margin-bottom: 20px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button {
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
        }
        button:hover {
            background-color: #45a049;
        }
        .score {
            font-size: 20px;
            margin-top: 20px;
        }
        .credits {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>Juego de Cuantificadores Matemáticos</h1>
    <div class="game-container">
        <div id="question-container">
            <div class="question" id="question"></div>
            <div class="options" id="options"></div>
        </div>
        <div class="score" id="score">Puntuación: 0</div>
        <button id="next-btn" style="display: none;">Siguiente Pregunta</button>
        <button id="restart-btn" style="display: none;">Reiniciar Juego</button>
    </div>
    <div class="credits">Hecho por Erick y Elverth, grupo 2</div>

    <script>
        const questions = [
            {
                question: "¿Qué significa el cuantificador ∀ (para todo)?",
                options: ["Existe al menos uno", "Para todos los elementos", "Ninguno", "Algunos"],
                answer: 1
            },
            {
                question: "¿Qué significa el cuantificador ∃ (existe)?",
                options: ["Para todos los elementos", "Existe al menos uno", "Ninguno", "Todos menos uno"],
                answer: 1
            },
            {
                question: "En lógica, ¿cuál es la negación de ∀x P(x)?",
                options: ["∃x ¬P(x)", "∀x ¬P(x)", "¬∃x P(x)", "∃x P(x)"],
                answer: 0
            },
            {
                question: "¿Cuál es un ejemplo de cuantificador universal?",
                options: ["Hay un número primo", "Todos los números pares son divisibles por 2", "No hay números negativos", "Algunos triángulos son equiláteros"],
                answer: 1
            },
            {
                question: "¿Cuál es un ejemplo de cuantificador existencial?",
                options: ["Todos los planetas orbitan el sol", "Hay un número primo mayor que 100", "Ningún cuadrado es un círculo", "Cada entero es racional"],
                answer: 1
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;

        const questionEl = document.getElementById('question');
        const optionsEl = document.getElementById('options');
        const scoreEl = document.getElementById('score');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');

        function loadQuestion() {
            const currentQuestion = questions[currentQuestionIndex];
            questionEl.textContent = currentQuestion.question;
            optionsEl.innerHTML = '';
            currentQuestion.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.textContent = option;
                button.onclick = () => selectAnswer(index);
                optionsEl.appendChild(button);
            });
            nextBtn.style.display = 'none';
        }

        function selectAnswer(selectedIndex) {
            const currentQuestion = questions[currentQuestionIndex];
            if (selectedIndex === currentQuestion.answer) {
                score++;
                alert('¡Correcto!');
            } else {
                alert('Incorrecto. La respuesta correcta es: ' + currentQuestion.options[currentQuestion.answer]);
            }
            scoreEl.textContent = 'Puntuación: ' + score;
            nextBtn.style.display = 'block';
        }

        nextBtn.onclick = () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                alert('Juego terminado. Tu puntuación final es: ' + score + '/' + questions.length);
                restartBtn.style.display = 'block';
                nextBtn.style.display = 'none';
            }
        };

        restartBtn.onclick = () => {
            currentQuestionIndex = 0;
            score = 0;
            scoreEl.textContent = 'Puntuación: 0';
            restartBtn.style.display = 'none';
            loadQuestion();
        };

        loadQuestion();
    </script>
</body>
</html>
